# Postgres, the web server and a separate worker. Secrets come from .env.
#
#   docker compose up --build              # Ollama running on the host
#   DOCKER_OLLAMA_URL=http://ollama:11434 docker compose --profile ollama up
#                                          # Ollama in a container too
#
# Then: http://localhost:8000/health

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://supportflow:supportflow@db:5432/supportflow
    # Not OLLAMA_URL: compose also reads .env, where that points at localhost.
    OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    RUN_WORKER_IN_PROCESS: "false"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow
      POSTGRES_DB: supportflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
